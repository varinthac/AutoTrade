# Shared defaults across dev/sandbox/live. Broker-specific overrides (symbol
# suffixes, server-specific quirks) belong in dev.yaml / sandbox.yaml / live.yaml
# once those are needed (Phase 3+).

global:
  timeframe: H1
  timezone: server # MT5 server time, per spec.md Appendix A §0
  # swing_pivot_bars: the fractal-confirmation lookback (features/swing.py)
  # used for stop-loss placement, structure-invalidation, and Council
  # scoring -- trading_system_summary_v2.md §6's own example config already
  # names this exact key (global.swing_pivot_bars: 3), an [adjustable]
  # parameter. 2026-07-22, EXP-009 (experiments/experiments_log.md) found
  # pivot_bars=4 beat 3 on Validation/Test, but that result was tuned against
  # the watchman: breakeven_enabled/trail_enabled defaults below when they
  # were still `true` (the now-fixed, net-harmful setting) -- a joint
  # re-verification the same day, after those gates were adopted as `false`,
  # found pivot_bars=4 does NOT add value on top of that fix (tested 3 ways:
  # risk-based sizing at $50,000 and $10,000 equity, and fixed 0.1 lot at the
  # real $3,000 equity -- all three agreed). Stays at 3; EXP-009's candidate
  # is superseded, not merely deferred.
  swing_pivot_bars: 3

# Canonical symbol name -> broker symbol name. IC Markets uses no suffix on
# its standard demo servers; change the right-hand side here if your account
# shows e.g. "XAUUSD.a" in Market Watch instead.
# Phase 9 (2026-07-21): a genuine out-of-sample backtest (2025-07-21 ->
# 2026-07-21, real IC Markets Raw Spread commission) showed the current
# rule-based Council only has an edge on XAUUSD (PF 1.28, net +$1,458 --
# close to but still short of the promotion-gate threshold). EURUSD/GBPUSD/
# USDJPY all lost money out-of-sample over the same window with the same
# logic (PF 0.84/0.91/0.95) -- the Appendix A thresholds don't currently
# generalize to forex majors. Commented out (not deleted) rather than
# removed from config/historical data, so they're easy to re-enable once
# the Council is revisited for FX specifically -- see
# data/db/backtest_reports/{EURUSD,GBPUSD,USDJPY}_20260721T06*.json for the
# full results.
symbols:
  XAUUSD: XAUUSD
  # EURUSD: EURUSD
  # GBPUSD: GBPUSD
  # USDJPY: USDJPY

historical:
  default_days: 730 # ~2 years, enough for a first backtest pass in Phase 4

# The Shield -- Portfolio Checkpoint (shield/), per
# trading_system_summary_v2.md Appendix A §2 / §6. All values [adjustable]
# per the spec. `max_positions_per_symbol` is called out as
# "[adjustable: เพิ่มเป็น 2 ได้หลัง live 3 เดือน]" -- raise to 2 only after
# 3 months of live results support it, not before.
shield:
  min_rr: 1.5
  max_correlation: 0.7
  max_positions_per_symbol: 1
  max_positions_total: 3
  total_risk_ceiling_pct: 3.0
  duplicate_signal_cooldown_hours: 4.0

# The CFO -- Money Manager (risk/), per trading_system_summary_v2.md
# Appendix A §3 / §6. All values [adjustable] per the spec.
#
# risk_per_trade_pct: 2026-07-22, raised from 0.5 -> 1.0 after a live signal
# was skipped for computing a lot size below the broker's 0.01 minimum on
# this $3,000 demo account. A param-tuner measurement (informational note,
# experiments/experiments_log.md) found 0.5% discards ~72% of otherwise-valid
# Council signals for this reason; 1.0% roughly halves that (~52%) while
# keeping worst-case single-trade/streak losses modest (~$60 / ~$307) on the
# current balance. The measurement also found PF is NOT stable across risk
# levels in this sweep, but for an unrelated reason (max_positions_per_symbol
# widening trade selection as skip-rate drops, not risk% itself) and flagged
# that a larger demo deposit would address the underlying constraint more
# directly than raising risk% further -- worth revisiting if skip-rate is
# still high in practice.
cfo:
  risk_per_trade_pct: 1.0
  daily_loss_limit_pct: 2.0
  max_consecutive_losses: 3
  max_drawdown_halt_pct: 8.0

# Council Bull/Bear scoring + Decision Matrix (council/scoring.py,
# council/decision_matrix.py), per trading_system_summary_v2.md Appendix A
# §1.1/§1.2/§1.3. All values [adjustable]. `conflict_threshold` is also the
# floor for the "conflicting signals" borderline case (§1.3's note).
council:
  bull_threshold: 70
  bear_threshold: 70
  conflict_threshold: 55

# Council order construction (council/order_construction.py), per
# trading_system_summary_v2.md Appendix A §1.4 / §6. All values [adjustable].
# max_retries/retry_delay_sec/max_entry_slippage_atr/min_rr_after_slippage
# are Phase 7b's execution-error handling (Appendix A §4.8), consumed by
# execution/demo_adapter.py's ThrottledDemoAdapter.
order:
  sl_buffer_atr: 0.2
  sl_min_atr: 0.8
  sl_max_atr: 2.5
  tp_r_multiple: 2.0
  max_retries: 2
  retry_delay_sec: 3
  max_entry_slippage_atr: 0.3
  min_rr_after_slippage: 1.3 # close immediately if realized R:R after slippage drops below this

# Risk Voice -- Council's own veto gate (council/risk_voice.py), per
# trading_system_summary_v2.md Appendix A §1.5 / §6. All values [adjustable].
# NOTE: with only StubNewsCalendarProvider wired in as a fallback
# (council/news_calendar.py, MQL5CalendarProvider used live when the MT5
# Service is running), a missing/failed calendar fetch always vetoes -- see
# that module's docstring.
#
# session_start_hour/session_end_hour: 2026-07-21, EXP-003/EXP-004
# (experiments/experiments_log.md) -- the original [14,18) London+NY-overlap
# window was never actually tested against "no session gate at all", only
# against other windows confined to London+NY (EXP-001, which correctly
# rejected widening WITHIN that range). EXP-003 tested removing the gate
# entirely and found all-24h beats [14,18) in 4/5 years including the
# held-out Test year, and the gate turned a winning year (2021-22, +$297)
# into a losing one (-$518) with no offsetting benefit. EXP-004 then tested
# EXP-003's own "keep a rollover guard" refinement (excluding hours 22-23
# specifically, session_start_hour=0/session_end_hour=22) and found it does
# NOT outperform literal all-24h on Train+Validation -- the "22-23 always
# loses" pattern is an aggregate artifact that doesn't hold every year, so
# REJECTED as a separate config. Net: 0/24 (no gate) is the evidence-backed
# choice, not a partial exclusion. The existing news_blackout_*/
# friday_close_hour below are UNCHANGED and still the live-risk controls
# EXP-003 explicitly said must stay regardless of the session-gate decision.
risk_voice:
  max_spread_multiple: 1.5
  max_spread_points_xauusd: 35
  news_blackout_before_min: 45
  news_blackout_after_min: 30
  max_stop_atr_multiple: 2.5
  session_start_hour: 0
  session_end_hour: 24
  friday_close_hour: 20
  max_atr_panic_multiple: 3.0

# The Watchman -- Position Monitor (watchman/), per trading_system_summary_v2.md
# Appendix A §4 / §6. All values [adjustable]. `dead_trade_r_band` is not in
# the spec's own §6 sample YAML block, but item 6's rule text ("กำไร/ขาดทุนอยู่
# ระหว่าง ±0.3R") requires it as a configurable threshold -- added here to
# match the codebase's established practice of keeping every threshold
# configurable rather than hardcoding it.
#
# Phase 7b additions (also not in the spec's own abbreviated §6 sample, same
# "every threshold configurable" reasoning): news_window_minutes/
# news_profit_threshold_r/news_close_mode are item 5's news protection
# (watchman/news_protection.py) -- news_close_mode: "half" (default, matches
# the spec's primary rule) or "all" (the spec's own explicitly-noted
# alternative, "[adjustable: หรือปิดทั้งไม้]"). connectivity_timeout_minutes
# is item 7's connectivity watchdog (watchman/connectivity_watchdog.py).
#
# breakeven_enabled/trail_enabled: 2026-07-22, EXP-008 (experiments/
# experiments_log.md), ADOPTED after a joint re-verification against
# global.swing_pivot_bars above. With Watchman's exit management modeled in
# the backtest (commit 67df406), the breakeven-then-trail mechanism engages
# well before trades reach the 2R take-profit target, cutting winners short;
# isolating structure-invalidation/time-stop (both gates `false`) beat the
# prior live config (both `true`) significantly on the held-out Test year
# and passes the Backtest -> Paper promotion Gate 1 (PF>=1.3) where the
# prior config did not. The joint re-verification (2026-07-22, three
# independent sizing-confound-free methods: risk-based sizing at $50,000
# equity, at $10,000 equity, and fixed 0.1 lot at the real $3,000 equity)
# found disabling ONLY these two gates (pivot_bars left at 3) consistently
# beat also changing pivot_bars to 4 -- EXP-009's pivot_bars=4 candidate was
# tuned against the now-superseded broken Watchman defaults and does not
# add value on top of this fix, so pivot_bars stays at 3 (see global block
# above) even though this pair was adopted.
watchman:
  breakeven_at_r: 1.0
  trail_start_r: 1.5
  trail_distance_atr: 1.0
  time_stop_hours: 48
  dead_trade_r_band: 0.3
  news_window_minutes: 30
  news_profit_threshold_r: 0.5
  news_close_mode: half
  connectivity_timeout_minutes: 5
  breakeven_enabled: false
  trail_enabled: false

# The Auditor -- Performance Reviewer (auditor/), per
# trading_system_summary_v2.md Appendix A §5 / §6. `current_stage` is a
# human-set marker only (backtest / paper / live_ramp / live_full) -- it
# distinguishes live_ramp from full-size live without any trade-record
# schema change (Phase 8b resolved decision: paper vs. live is a separate DB
# file, per store/models.py's DEFAULT_PAPER_DB_PATH/DEFAULT_LIVE_DB_PATH;
# live_ramp vs. full-live is this marker instead). `promotion:`/`demotion:`/
# `borderline:` sub-blocks are injected into auditor/promotion.py's
# PromotionThresholds, auditor/demotion.py's thresholds, and
# auditor/borderline.py's expectancy-signal thresholds respectively --
# none of those modules read this file themselves (scripts/run_auditor.py
# does, same RiskVoiceConfig-style injection convention as council/risk_voice.py).
# Telegram notifications (notify/telegram.py) -- best-effort, single chat,
# no rate-limiting/dedupe (fires on every safety event, trade open/close,
# daily summary, promotion/demotion gate change). Requires TELEGRAM_BOT_TOKEN
# + TELEGRAM_CHAT_ID in .env; missing credentials silently no-op regardless
# of `enabled` here.
notifications:
  enabled: true
  timeout_sec: 4.0

auditor:
  current_stage: backtest
  promotion:
    backtest_min_profit_factor: 1.3
    backtest_max_drawdown_pct: 15.0
    backtest_min_trade_count: 200
    backtest_min_profit_factor_excluding_top_5: 1.0
    paper_min_trade_count: 100
    paper_min_weeks_fast_track: 16
    paper_min_weeks_floor: 8
    paper_min_profit_factor: 1.2
    paper_max_drawdown_pct: 12.0
    paper_max_deviation_pct: 30.0
    live_ramp_min_months: 3
    live_ramp_min_profit_factor: 1.2
    live_ramp_min_avg_net_r: 0.0
  demotion:
    consecutive_loss_months: 2
    rolling_pf_window_days: 60
    rolling_pf_min: 1.0
    win_rate_divergence_pct_points: 15.0
    win_rate_divergence_min_trades: 50
  borderline:
    min_cases_for_signal: 30
    min_avg_r_for_signal: 0.2
