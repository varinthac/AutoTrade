# Shared defaults across dev/sandbox/live. Broker-specific overrides (symbol
# suffixes, server-specific quirks) belong in dev.yaml / sandbox.yaml / live.yaml
# once those are needed (Phase 3+).

global:
  timeframe: H1
  timezone: server # MT5 server time, per spec.md Appendix A §0

# Canonical symbol name -> broker symbol name. IC Markets uses no suffix on
# its standard demo servers; change the right-hand side here if your account
# shows e.g. "XAUUSD.a" in Market Watch instead.
symbols:
  XAUUSD: XAUUSD
  EURUSD: EURUSD
  GBPUSD: GBPUSD
  USDJPY: USDJPY

historical:
  default_days: 730 # ~2 years, enough for a first backtest pass in Phase 4

# The Shield -- Portfolio Checkpoint (shield/), per
# trading_system_summary_v2.md Appendix A §2 / §6. All values [adjustable]
# per the spec. `max_positions_per_symbol` is called out as
# "[adjustable: เพิ่มเป็น 2 ได้หลัง live 3 เดือน]" -- raise to 2 only after
# 3 months of live results support it, not before.
shield:
  min_rr: 1.5
  max_correlation: 0.7
  max_positions_per_symbol: 1
  max_positions_total: 3
  total_risk_ceiling_pct: 3.0
  duplicate_signal_cooldown_hours: 4.0

# The CFO -- Money Manager (risk/), per trading_system_summary_v2.md
# Appendix A §3 / §6. All values [adjustable] per the spec.
cfo:
  risk_per_trade_pct: 0.5
  daily_loss_limit_pct: 2.0
  max_consecutive_losses: 3
  max_drawdown_halt_pct: 8.0

# Council order construction (council/order_construction.py), per
# trading_system_summary_v2.md Appendix A §1.4 / §6. All values [adjustable].
order:
  sl_buffer_atr: 0.2
  sl_min_atr: 0.8
  sl_max_atr: 2.5
  tp_r_multiple: 2.0
  max_retries: 2 # not yet consumed -- Watchman phase (Appendix A §4.8)
  retry_delay_sec: 3 # not yet consumed -- Watchman phase (Appendix A §4.8)
  max_entry_slippage_atr: 0.3 # not yet consumed -- Watchman phase (Appendix A §4.8)
