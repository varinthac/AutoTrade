# Shared defaults across dev/sandbox/live. Broker-specific overrides (symbol
# suffixes, server-specific quirks) belong in dev.yaml / sandbox.yaml / live.yaml
# once those are needed (Phase 3+).

global:
  timeframe: H1
  timezone: server # MT5 server time, per spec.md Appendix A §0

# Canonical symbol name -> broker symbol name. IC Markets uses no suffix on
# its standard demo servers; change the right-hand side here if your account
# shows e.g. "XAUUSD.a" in Market Watch instead.
symbols:
  XAUUSD: XAUUSD
  EURUSD: EURUSD
  GBPUSD: GBPUSD
  USDJPY: USDJPY

historical:
  default_days: 730 # ~2 years, enough for a first backtest pass in Phase 4

# The Shield -- Portfolio Checkpoint (shield/), per
# trading_system_summary_v2.md Appendix A §2 / §6. All values [adjustable]
# per the spec. `max_positions_per_symbol` is called out as
# "[adjustable: เพิ่มเป็น 2 ได้หลัง live 3 เดือน]" -- raise to 2 only after
# 3 months of live results support it, not before.
shield:
  min_rr: 1.5
  max_correlation: 0.7
  max_positions_per_symbol: 1
  max_positions_total: 3
  total_risk_ceiling_pct: 3.0
  duplicate_signal_cooldown_hours: 4.0

# The CFO -- Money Manager (risk/), per trading_system_summary_v2.md
# Appendix A §3 / §6. All values [adjustable] per the spec.
cfo:
  risk_per_trade_pct: 0.5
  daily_loss_limit_pct: 2.0
  max_consecutive_losses: 3
  max_drawdown_halt_pct: 8.0

# Council Bull/Bear scoring + Decision Matrix (council/scoring.py,
# council/decision_matrix.py), per trading_system_summary_v2.md Appendix A
# §1.1/§1.2/§1.3. All values [adjustable]. `conflict_threshold` is also the
# floor for the "conflicting signals" borderline case (§1.3's note).
council:
  bull_threshold: 70
  bear_threshold: 70
  conflict_threshold: 55

# Council order construction (council/order_construction.py), per
# trading_system_summary_v2.md Appendix A §1.4 / §6. All values [adjustable].
# max_retries/retry_delay_sec/max_entry_slippage_atr/min_rr_after_slippage
# are Phase 7b's execution-error handling (Appendix A §4.8), consumed by
# execution/demo_adapter.py's ThrottledDemoAdapter.
order:
  sl_buffer_atr: 0.2
  sl_min_atr: 0.8
  sl_max_atr: 2.5
  tp_r_multiple: 2.0
  max_retries: 2
  retry_delay_sec: 3
  max_entry_slippage_atr: 0.3
  min_rr_after_slippage: 1.3 # close immediately if realized R:R after slippage drops below this

# Risk Voice -- Council's own veto gate (council/risk_voice.py), per
# trading_system_summary_v2.md Appendix A §1.5 / §6. All values [adjustable].
# session_start_hour/session_end_hour approximate the London+New York
# session overlap in MT5 SERVER time -- see risk_voice.py's module docstring
# for the exact reasoning and its DST caveat (broker server-time offsets
# drift with UK/US daylight saving, so this needs periodic manual
# re-verification, not a one-time pick). NOTE: with only
# StubNewsCalendarProvider wired in (council/news_calendar.py), the news
# condition below always vetoes -- see that module's docstring.
risk_voice:
  max_spread_multiple: 1.5
  max_spread_points_xauusd: 35
  news_blackout_before_min: 45
  news_blackout_after_min: 30
  max_stop_atr_multiple: 2.5
  session_start_hour: 14
  session_end_hour: 18
  friday_close_hour: 20
  max_atr_panic_multiple: 3.0

# The Watchman -- Position Monitor (watchman/), per trading_system_summary_v2.md
# Appendix A §4 / §6. All values [adjustable]. `dead_trade_r_band` is not in
# the spec's own §6 sample YAML block, but item 6's rule text ("กำไร/ขาดทุนอยู่
# ระหว่าง ±0.3R") requires it as a configurable threshold -- added here to
# match the codebase's established practice of keeping every threshold
# configurable rather than hardcoding it.
#
# Phase 7b additions (also not in the spec's own abbreviated §6 sample, same
# "every threshold configurable" reasoning): news_window_minutes/
# news_profit_threshold_r/news_close_mode are item 5's news protection
# (watchman/news_protection.py) -- news_close_mode: "half" (default, matches
# the spec's primary rule) or "all" (the spec's own explicitly-noted
# alternative, "[adjustable: หรือปิดทั้งไม้]"). connectivity_timeout_minutes
# is item 7's connectivity watchdog (watchman/connectivity_watchdog.py).
watchman:
  breakeven_at_r: 1.0
  trail_start_r: 1.5
  trail_distance_atr: 1.0
  time_stop_hours: 48
  dead_trade_r_band: 0.3
  news_window_minutes: 30
  news_profit_threshold_r: 0.5
  news_close_mode: half
  connectivity_timeout_minutes: 5

# The Auditor -- Performance Reviewer (auditor/), per
# trading_system_summary_v2.md Appendix A §5 / §6. `current_stage` is a
# human-set marker only (backtest / paper / live_ramp / live_full) -- it
# distinguishes live_ramp from full-size live without any trade-record
# schema change (Phase 8b resolved decision: paper vs. live is a separate DB
# file, per store/models.py's DEFAULT_PAPER_DB_PATH/DEFAULT_LIVE_DB_PATH;
# live_ramp vs. full-live is this marker instead). `promotion:`/`demotion:`/
# `borderline:` sub-blocks are injected into auditor/promotion.py's
# PromotionThresholds, auditor/demotion.py's thresholds, and
# auditor/borderline.py's expectancy-signal thresholds respectively --
# none of those modules read this file themselves (scripts/run_auditor.py
# does, same RiskVoiceConfig-style injection convention as council/risk_voice.py).
# Telegram notifications (notify/telegram.py) -- best-effort, single chat,
# no rate-limiting/dedupe (fires on every safety event, trade open/close,
# daily summary, promotion/demotion gate change). Requires TELEGRAM_BOT_TOKEN
# + TELEGRAM_CHAT_ID in .env; missing credentials silently no-op regardless
# of `enabled` here.
notifications:
  enabled: true
  timeout_sec: 4.0

auditor:
  current_stage: backtest
  promotion:
    backtest_min_profit_factor: 1.3
    backtest_max_drawdown_pct: 15.0
    backtest_min_trade_count: 200
    backtest_min_profit_factor_excluding_top_5: 1.0
    paper_min_trade_count: 100
    paper_min_weeks_fast_track: 16
    paper_min_weeks_floor: 8
    paper_min_profit_factor: 1.2
    paper_max_drawdown_pct: 12.0
    paper_max_deviation_pct: 30.0
    live_ramp_min_months: 3
    live_ramp_min_profit_factor: 1.2
    live_ramp_min_avg_net_r: 0.0
  demotion:
    consecutive_loss_months: 2
    rolling_pf_window_days: 60
    rolling_pf_min: 1.0
    win_rate_divergence_pct_points: 15.0
    win_rate_divergence_min_trades: 50
  borderline:
    min_cases_for_signal: 30
    min_avg_r_for_signal: 0.2
