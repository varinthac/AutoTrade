<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AutoTrade Dashboard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <nav>
      <a href="{{ url_for('trades') }}">Trades</a>
      <a href="{{ url_for('daily') }}">Daily</a>
    </nav>
    <p>&#9432; <strong>All times are MT5 broker SERVER time, not your local time.</strong></p>
    {% if current_server_time %}
    <p class="server-time">Current server time: {{ current_server_time }}</p>
    {% else %}
    <p class="server-time">Current server time: (unavailable -- check MT5 terminal)</p>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
