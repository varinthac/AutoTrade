<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoTrade Dashboard</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <p id="webapp-auth-message">Verifying Telegram Web App session&hellip;</p>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var tg = window.Telegram && window.Telegram.WebApp;
      var initData = tg ? tg.initData : "";
      // Only ever attempt the auto-redirect once per initData value -- if
      // this page is reached again WITH an initData param already present,
      // verification already failed for it server-side, so retrying the
      // same value would just loop forever instead of showing the operator
      // anything.
      if (initData && !params.has("initData")) {
        params.set("initData", initData);
        window.location.replace(window.location.pathname + "?" + params.toString());
        return;
      }
      document.getElementById("webapp-auth-message").textContent =
        "Unauthorized -- open this page from the AutoTrade Telegram bot's Web App button.";
    })();
  </script>
</body>
</html>
